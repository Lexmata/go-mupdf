version: '3.8'

services:
  test:
    build:
      context: .
      # Use the same Dockerfile as the make docker-* targets so there is a
      # single Docker test path
      dockerfile: Dockerfile.test
    image: go-mupdf-test:latest
    volumes:
      # Note: the source tree is deliberately NOT mounted here, so tests run
      # against the image exactly as it was built (including the MuPDF
      # libraries compiled during the image build).
      # Cache Go modules
      - go-modules:/go/pkg/mod
    environment:
      - CGO_ENABLED=1
      - GOOS=linux
      - GOARCH=amd64
    command: go test ./pkg/mupdf/ -v
    # Override command for interactive shell:
    # command: /bin/bash

volumes:
  go-modules:

