image: golang:1.24

definitions:
  caches:
    go: /go/pkg/mod
    mupdf-libs:
      key:
        files:
          - .gitmodules
      path: mupdf-artifacts

  services:
    docker:
      memory: 2048

  steps:
    - step: &build-mupdf
        name: Build MuPDF Libraries
        caches:
          - mupdf-libs
        script:
          - apt-get update
          - apt-get install -y build-essential pkg-config unzip
          - git submodule update --init --recursive
          - echo "Building MuPDF libraries artifact..."
          - ./scripts/build-mupdf-artifact.sh
          - echo "MuPDF artifact created successfully"
        artifacts:
          - mupdf-artifacts/**
    - step: &lint
        name: Lint Code
        caches:
          - go
        script:
          - apt-get update
          - apt-get install -y build-essential pkg-config unzip curl wget
          - git submodule update --init --recursive || echo "Submodule init failed"
          - echo "Setting up MuPDF libraries..."
          - ./scripts/setup-mupdf.sh
          - 'echo "Current directory: $(pwd)"'
          - |
            if [ ! -f "go.mod" ]; then
              echo "ERROR: go.mod not found in current directory"
              echo "Current directory contents:"
              ls -la
              exit 1
            fi
          - 'echo "Project root verified: $(pwd)"'
          - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          - export PATH=$PATH:$(go env GOPATH)/bin
          - export GOTOOLCHAIN=auto
          - export GOFLAGS=-buildvcs=false
          - echo "Checking code formatting with gofmt..."
          - |
            UNFORMATTED=$(gofmt -l .)
            if [ -n "$UNFORMATTED" ]; then
              echo "❌ The following files are not properly formatted:"
              echo "$UNFORMATTED"
              exit 1
            else
              echo "✅ All files are properly formatted"
            fi
          - echo "Running go vet..."
          - echo "Checking for cmd directory..."
          - ls -la cmd 2>/dev/null || echo "cmd directory not found"
          - |
            if [ -d "cmd" ] && [ -n "$(find cmd -name '*.go' -type f 2>/dev/null | head -1)" ]; then
              echo "cmd directory found with Go files, running go vet on pkg and cmd"
              go vet ./pkg/... ./cmd/...
            else
              echo "cmd directory not found or empty, running go vet on pkg only"
              go vet ./pkg/...
            fi
          - echo "Running golangci-lint..."
          - |
            if [ -d "cmd" ] && [ -n "$(find cmd -name '*.go' -type f 2>/dev/null | head -1)" ]; then
              echo "cmd directory found with Go files, running golangci-lint on pkg and cmd"
              golangci-lint run ./pkg/... ./cmd/...
            else
              echo "cmd directory not found or empty, running golangci-lint on pkg only"
              golangci-lint run ./pkg/...
            fi
          - |
            if command -v staticcheck >/dev/null 2>&1; then
              echo "Running staticcheck..."
              if [ -d "cmd" ] && [ -n "$(find cmd -name '*.go' -type f 2>/dev/null | head -1)" ]; then
                echo "cmd directory found with Go files, running staticcheck on pkg and cmd"
                staticcheck ./pkg/... ./cmd/...
              else
                echo "cmd directory not found or empty, running staticcheck on pkg only"
                staticcheck ./pkg/...
              fi
            else
              echo "Installing staticcheck..."
              go install honnef.co/go/tools/cmd/staticcheck@latest
              if [ -d "cmd" ] && [ -n "$(find cmd -name '*.go' -type f 2>/dev/null | head -1)" ]; then
                echo "cmd directory found with Go files, running staticcheck on pkg and cmd"
                staticcheck ./pkg/... ./cmd/...
              else
                echo "cmd directory not found or empty, running staticcheck on pkg only"
                staticcheck ./pkg/...
              fi
            fi
    - step: &test
        name: Run Tests
        caches:
          - go
        script:
          - apt-get update
          - apt-get install -y build-essential pkg-config unzip curl wget
          - 'echo "Initial working directory: $(pwd)"'
          - |
            if [ ! -f "go.mod" ]; then
              echo "ERROR: go.mod not found in current directory"
              echo "Current directory contents:"
              ls -la
              exit 1
            fi
          - 'echo "Project root verified: $(pwd)"'
          - git submodule update --init --recursive || echo "Submodule init failed"
          - echo "Setting up MuPDF libraries..."
          - ./scripts/setup-mupdf.sh
          - export GO111MODULE=on
          - export CGO_ENABLED=1
          - export GOOS=linux
          - export GOARCH=amd64
          - export GOTOOLCHAIN=auto
          - cd $(git rev-parse --show-toplevel 2>/dev/null || pwd)
          - 'echo "Final working directory: $(pwd)"'
          - go mod download
          - 'echo "Current directory: $(pwd)"'
          - echo "Verifying project structure..."
          - 'test -f go.mod || (echo "ERROR: go.mod not found" && exit 1)'
          - 'test -d pkg/mupdf || (echo "ERROR: pkg/mupdf directory not found" && exit 1)'
          - 'test -d third_party/mupdf || (echo "ERROR: third_party/mupdf directory not found" && exit 1)'
          - echo "Checking package files..."
          - ls -la pkg/mupdf/*.go | head -3 || echo "Package files not found"
          - echo "Checking MuPDF libraries..."
          - ls -la third_party/mupdf/build/release/*.a | head -3 || echo "MuPDF libraries not found"
          - echo "Verifying Go module path..."
          - go list -m || echo "Failed to list module"
          - echo "Checking package can be listed..."
          - go list ./pkg/mupdf || echo "Failed to list package"
          - echo "Running all tests with race detection..."
          - go test -v -race ./pkg/mupdf/
          - echo "Running package tests with coverage..."
          - go test -v -race -coverprofile=coverage.out ./pkg/mupdf/
          - echo "Generating coverage report..."
          - go tool cover -html=coverage.out -o coverage.html
          - go tool cover -func=coverage.out
          - echo "Uploading coverage to Codecov..."
          - |
            if [ -n "$CODECOV_TOKEN" ]; then
              curl -s https://codecov.io/bash | bash -s - -f coverage.out -t $CODECOV_TOKEN || echo "Codecov upload failed"
            else
              echo "CODECOV_TOKEN not set, skipping Codecov upload"
            fi
        artifacts:
          - coverage.html
          - coverage.out

pipelines:
  default:
    - parallel:
      - step: *lint
      - step: *test

  branches:
    main:
      - parallel:
        - step: *lint
        - step:
            name: Run Tests and Benchmarks
            caches:
              - go
            script:
            - apt-get update
            - apt-get install -y build-essential pkg-config unzip curl wget
            - git submodule update --init --recursive || echo "Submodule init failed"
            - echo "Setting up MuPDF libraries..."
            - ./scripts/setup-mupdf.sh
            - export GO111MODULE=on
            - export CGO_ENABLED=1
            - export GOOS=linux
            - export GOARCH=amd64
            - export GOTOOLCHAIN=auto
            - go mod download
            - 'echo "Current directory: $(pwd)"'
            - echo "Verifying project structure..."
            - 'test -f go.mod || (echo "ERROR: go.mod not found" && exit 1)'
            - 'test -d pkg/mupdf || (echo "ERROR: pkg/mupdf directory not found" && exit 1)'
            - 'test -d third_party/mupdf || (echo "ERROR: third_party/mupdf directory not found" && exit 1)'
            - echo "Checking package files..."
            - ls -la pkg/mupdf/*.go | head -3 || echo "Package files not found"
            - echo "Checking MuPDF libraries..."
            - ls -la third_party/mupdf/build/release/*.a | head -3 || echo "MuPDF libraries not found"
            - echo "Verifying Go module path..."
            - go list -m || echo "Failed to list module"
            - echo "Checking package can be listed..."
            - go list ./pkg/mupdf || echo "Failed to list package"
            - echo "Running comprehensive tests with race detection..."
            - go test -v -race -coverprofile=coverage.out ./pkg/mupdf/
            - echo "Running benchmarks..."
            - go test -v -bench=. -benchmem ./pkg/mupdf/
            - echo "Generating coverage report..."
            - go tool cover -html=coverage.out -o coverage.html
            - go tool cover -func=coverage.out
            - echo "Uploading coverage to Codecov..."
            - |
              if [ -n "$CODECOV_TOKEN" ]; then
                curl -s https://codecov.io/bash | bash -s - -f coverage.out -t $CODECOV_TOKEN || echo "Codecov upload failed"
              else
                echo "CODECOV_TOKEN not set, skipping Codecov upload"
              fi
            - |
              if [ -d "cmd" ] && [ -n "$(find cmd -name '*.go' -type f 2>/dev/null | head -1)" ]; then
                echo "Building command line tools..."
                go build -v ./cmd/...
              else
                echo "cmd directory not found or contains no Go files, skipping build"
              fi
          artifacts:
            - coverage.html
            - coverage.out

  tags:
    v*:
      - step: *build-mupdf
      - parallel:
        - step: *lint
        - step:
            name: Run Tests for Release
            caches:
              - go
              - mupdf-libs
            script:
            - apt-get update
            - apt-get install -y build-essential pkg-config unzip
            - git submodule update --init --recursive || echo "Submodule init failed"
            - echo "Installing pre-built MuPDF libraries..."
            - ./scripts/install-prebuilt-libs.sh
            - export GO111MODULE=on
            - export CGO_ENABLED=1
            - export TAG_NAME=$BITBUCKET_TAG
            - export GOTOOLCHAIN=auto
            - 'echo "Building release for tag: $TAG_NAME"'
            - go mod download
            - 'echo "Current directory: $(pwd)"'
            - echo "Verifying project structure..."
            - 'test -f go.mod || (echo "ERROR: go.mod not found" && exit 1)'
            - 'test -d pkg/mupdf || (echo "ERROR: pkg/mupdf directory not found" && exit 1)'
            - 'test -d third_party/mupdf || (echo "ERROR: third_party/mupdf directory not found" && exit 1)'
            - echo "Checking package files..."
            - ls -la pkg/mupdf/*.go | head -3 || echo "Package files not found"
            - echo "Checking MuPDF libraries..."
            - ls -la third_party/mupdf/build/release/*.a | head -3 || echo "MuPDF libraries not found"
            - echo "Verifying Go module path..."
            - go list -m || echo "Failed to list module"
            - echo "Checking package can be listed..."
            - go list ./pkg/mupdf || echo "Failed to list package"
            - echo "Running comprehensive test suite..."
            - go test -v -race -coverprofile=release-coverage.out ./pkg/mupdf/
            - go tool cover -func=release-coverage.out
            - echo "Uploading coverage to Codecov..."
            - |
              if [ -n "$CODECOV_TOKEN" ]; then
                curl -s https://codecov.io/bash | bash -s - -f release-coverage.out -t $CODECOV_TOKEN || echo "Codecov upload failed"
              else
                echo "CODECOV_TOKEN not set, skipping Codecov upload"
              fi
          artifacts:
            - release-coverage.out
      - step:
          name: Build Release Artifacts
          caches:
            - go
            - mupdf-libs
          script:
            - apt-get update
            - apt-get install -y build-essential pkg-config unzip curl jq zip
            - git submodule update --init --recursive || echo "Submodule init failed"
            - echo "Installing pre-built MuPDF libraries..."
            - ./scripts/install-prebuilt-libs.sh
            - export GO111MODULE=on
            - export CGO_ENABLED=1
            - export TAG_NAME=$BITBUCKET_TAG
            - export GOTOOLCHAIN=auto
            - 'echo "Building release artifacts for tag: $TAG_NAME"'
            - go mod download
            - mkdir -p releases/{source,binaries,documentation}
            - echo "Building command line tools..."
            - CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=$TAG_NAME" -o releases/binaries/go-mupdf-linux-amd64 ./cmd/go-mupdf/ || echo "go-mupdf tool not built"
            - CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=$TAG_NAME" -o releases/binaries/create-test-pdf-linux-amd64 ./cmd/create-test-pdf/ || echo "create-test-pdf tool not built"
            - echo "Creating source archive..."
            - git archive --format=tar.gz --prefix=go-mupdf-$TAG_NAME/ $TAG_NAME > releases/source/go-mupdf-$TAG_NAME-source.tar.gz
            - echo "Packaging documentation..."
            - tar -czf releases/documentation/go-mupdf-$TAG_NAME-docs.tar.gz docs/ examples/ README.md LICENSE CHANGELOG.md
            - |
              cd releases/binaries
              if [ -f "go-mupdf-linux-amd64" ]; then
                tar -czf go-mupdf-$TAG_NAME-linux-amd64.tar.gz go-mupdf-linux-amd64
                echo "Created go-mupdf binary archive"
              fi
              if [ -f "create-test-pdf-linux-amd64" ]; then
                tar -czf create-test-pdf-$TAG_NAME-linux-amd64.tar.gz create-test-pdf-linux-amd64
                echo "Created create-test-pdf binary archive"
              fi
              cd ../..
            - echo "Generating release notes..."
            - |
              cat > releases/RELEASE_NOTES.md << EOF
              **Release Date**: $(date +"%Y-%m-%d")
              **Git Tag**: $TAG_NAME
              **Commit**: $BITBUCKET_COMMIT
              \`\`\`bash
              go get bitbucket.org/lexmata/go-mupdf@$TAG_NAME
              \`\`\`
              - [Linux AMD64 Tools](releases/binaries/)
              - [Source Code](releases/source/)
              - [Documentation](releases/documentation/)
              - **Source Code**: Complete Go MuPDF wrapper with MuPDF library
              - **Documentation**: Comprehensive guides and API reference
              - **Examples**: Working code examples and tutorials
              - **Command Line Tools**: go-mupdf and create-test-pdf utilities
              - **Tests**: Full test suite with 81.8% coverage
              - Go 1.21 or later
              - C compiler (GCC/Clang/MSVC)
              - Make build system
              - System dependencies (see installation guide)
              $(grep -A 50 "## \[$TAG_NAME\]" CHANGELOG.md | head -50)
              \`\`\`
              $(find releases -type f -name "*.tar.gz" -exec sha256sum {} \;)
              \`\`\`
              \`\`\`
              $(go tool cover -func=release-coverage.out | tail -1)
              \`\`\`
              ---
              For support, documentation, and examples, visit the [repository](https://bitbucket.org/lexmata/go-mupdf).
              EOF
            - echo "Generating checksums..."
            - cd releases && find . -type f -name "*.tar.gz" -exec sha256sum {} \; > SHA256SUMS && cd ..
            - echo "=== Release Summary ==="
            - 'echo "Tag: $TAG_NAME"'
            - 'echo "Files created:"'
            - find releases -type f -ls
            - echo "===================="
          after-script:
            # Upload to Bitbucket Downloads (if configured)
            - |
              TOKEN="${BITBUCKET_DOWNLOADS_TOKEN:-$BITBUCKET_API_TOKEN}"
              USERNAME="${BITBUCKET_USERNAME}"
              if [ ! -z "$TOKEN" ] && [ ! -z "$USERNAME" ]; then
                echo "Uploading release artifacts to Bitbucket Downloads..."
                UPLOAD_SUCCESS=true
                for file in releases/binaries/*.tar.gz releases/source/*.tar.gz releases/documentation/*.tar.gz; do
                  if [ -f "$file" ]; then
                    filename=$(basename "$file")
                    echo "Uploading $filename..."
                    RESPONSE=$(curl -s -X POST \
                      "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_OWNER/$BITBUCKET_REPO_SLUG/downloads" \
                      -u "$USERNAME:$TOKEN" \
                      -F "files=@$file" \
                      -w "\n%{http_code}")
                    HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
                    BODY=$(echo "$RESPONSE" | sed '$d')
                    if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
                      echo "✓ Uploaded $filename successfully (HTTP $HTTP_CODE)"
                    else
                      echo "✗ Failed to upload $filename (HTTP $HTTP_CODE)"
                      echo "Response: $BODY"
                      UPLOAD_SUCCESS=false
                    fi
                  fi
                done
                if [ "$UPLOAD_SUCCESS" = "false" ]; then
                  echo ""
                  echo "⚠️  UPLOAD FAILED - Authentication Issue"
                  echo ""
                  echo "Required Repository Variables:"
                  echo "1. BITBUCKET_USERNAME - Your Bitbucket account username/email"
                  echo "2. BITBUCKET_DOWNLOADS_TOKEN - App password with 'Repositories: Write'"
                  echo ""
                  echo "Setup Instructions:"
                  echo "1. Go to: https://bitbucket.org/account/settings/app-passwords/"
                  echo "2. Create app password with 'Repositories: Write' permission"
                  echo "3. Add both variables at: Repository Settings > Pipelines > Repository variables"
                  echo ""
                  echo "Files are available as pipeline artifacts in the meantime."
                fi
              else
                if [ -z "$USERNAME" ]; then
                  echo "⚠️  BITBUCKET_USERNAME not set, skipping upload"
                  echo "Set your Bitbucket username as a repository variable"
                fi
                if [ -z "$TOKEN" ]; then
                  echo "⚠️  No authentication token available, skipping upload"
                fi
              fi

          artifacts:
            - releases/**
            - release-coverage.out
      - parallel:
        - step:
            name: Build Static Library Distribution (AMD64)
            caches:
              - go
              - mupdf-libs
            script:
              - apt-get update
              - apt-get install -y build-essential pkg-config unzip
              - git submodule update --init --recursive
              - export TAG_NAME=$BITBUCKET_TAG
              - export VERSION=${TAG_NAME#v}
              - export GOARCH=amd64
              - 'echo "Building static library distribution for linux-amd64 version: $VERSION"'
              - ./scripts/build-static-libs.sh
              - echo "=== AMD64 Distribution Package Created ==="
              - ls -lh dist/
              - cat dist/*.sha256
              - echo "===================================="
            after-script:
              - |
                TOKEN="${BITBUCKET_DOWNLOADS_TOKEN:-$BITBUCKET_API_TOKEN}"
                USERNAME="${BITBUCKET_USERNAME}"
                if [ ! -z "$TOKEN" ] && [ ! -z "$USERNAME" ]; then
                  echo "Uploading distribution packages to Bitbucket Downloads..."
                  UPLOAD_SUCCESS=true
                  for file in dist/*.tar.gz dist/*.sha256; do
                    if [ -f "$file" ]; then
                      filename=$(basename "$file")
                      echo "Uploading $filename..."
                      RESPONSE=$(curl -s -X POST \
                        "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_OWNER/$BITBUCKET_REPO_SLUG/downloads" \
                        -u "$USERNAME:$TOKEN" \
                        -F "files=@$file" \
                        -w "\n%{http_code}")
                      HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
                      BODY=$(echo "$RESPONSE" | sed '$d')
                      if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
                        echo "✓ Uploaded $filename successfully (HTTP $HTTP_CODE)"
                      else
                        echo "✗ Failed to upload $filename (HTTP $HTTP_CODE)"
                        echo "Response: $BODY"
                        UPLOAD_SUCCESS=false
                      fi
                    fi
                  done
                  if [ "$UPLOAD_SUCCESS" = "false" ]; then
                    echo ""
                    echo "⚠️  UPLOAD FAILED - Authentication Issue"
                    echo ""
                    echo "Required Repository Variables:"
                    echo "1. BITBUCKET_USERNAME - Your Bitbucket account username/email"
                    echo "2. BITBUCKET_DOWNLOADS_TOKEN - App password with 'Repositories: Write'"
                    echo ""
                    echo "Setup Instructions:"
                    echo "1. Go to: https://bitbucket.org/account/settings/app-passwords/"
                    echo "2. Create app password with 'Repositories: Write' permission"
                    echo "3. Add both variables at: Repository Settings > Pipelines > Repository variables"
                    echo ""
                    echo "Files are available as pipeline artifacts in the meantime."
                  fi
                else
                  if [ -z "$USERNAME" ]; then
                    echo "⚠️  BITBUCKET_USERNAME not set, skipping upload"
                    echo "Set your Bitbucket username as a repository variable"
                  fi
                  if [ -z "$TOKEN" ]; then
                    echo "⚠️  No authentication token available, skipping upload"
                  fi
                fi
            artifacts:
              - dist/*.tar.gz
              - dist/*.sha256
        - step:
            name: Build Static Library Distribution (ARM64)
            caches:
              - go
            script:
              - apt-get update
              - apt-get install -y build-essential pkg-config unzip gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static
              - git submodule update --init --recursive
              - export TAG_NAME=$BITBUCKET_TAG
              - export VERSION=${TAG_NAME#v}
              - export GOOS=linux
              - export GOARCH=arm64
              - export CC=aarch64-linux-gnu-gcc
              - export CXX=aarch64-linux-gnu-g++
              - export CGO_ENABLED=1
              - 'echo "Building static library distribution for linux-arm64 version: $VERSION"'
              - 'echo "Cross-compiling MuPDF for ARM64..."'
              - ./scripts/build-static-libs.sh
              - echo "=== ARM64 Distribution Package Created ==="
              - ls -lh dist/
              - cat dist/*.sha256
              - echo "===================================="
            after-script:
              - |
                TOKEN="${BITBUCKET_DOWNLOADS_TOKEN:-$BITBUCKET_API_TOKEN}"
                USERNAME="${BITBUCKET_USERNAME}"
                if [ ! -z "$TOKEN" ] && [ ! -z "$USERNAME" ]; then
                  echo "Uploading ARM64 distribution packages to Bitbucket Downloads..."
                  UPLOAD_SUCCESS=true
                  for file in dist/*.tar.gz dist/*.sha256; do
                    if [ -f "$file" ]; then
                      filename=$(basename "$file")
                      echo "Uploading $filename..."
                      RESPONSE=$(curl -s -X POST \
                        "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_OWNER/$BITBUCKET_REPO_SLUG/downloads" \
                        -u "$USERNAME:$TOKEN" \
                        -F "files=@$file" \
                        -w "\n%{http_code}")
                      HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
                      BODY=$(echo "$RESPONSE" | sed '$d')
                      if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
                        echo "✓ Uploaded $filename successfully (HTTP $HTTP_CODE)"
                      else
                        echo "✗ Failed to upload $filename (HTTP $HTTP_CODE)"
                        echo "Response: $BODY"
                        UPLOAD_SUCCESS=false
                      fi
                    fi
                  done
                  if [ "$UPLOAD_SUCCESS" = "false" ]; then
                    echo ""
                    echo "⚠️  UPLOAD FAILED - Authentication Issue"
                    echo ""
                    echo "Required Repository Variables:"
                    echo "1. BITBUCKET_USERNAME - Your Bitbucket account username/email"
                    echo "2. BITBUCKET_DOWNLOADS_TOKEN - App password with 'Repositories: Write'"
                    echo ""
                    echo "Setup Instructions:"
                    echo "1. Go to: https://bitbucket.org/account/settings/app-passwords/"
                    echo "2. Create app password with 'Repositories: Write' permission"
                    echo "3. Add both variables at: Repository Settings > Pipelines > Repository variables"
                    echo ""
                    echo "Files are available as pipeline artifacts in the meantime."
                  fi
                else
                  if [ -z "$USERNAME" ]; then
                    echo "⚠️  BITBUCKET_USERNAME not set, skipping upload"
                    echo "Set your Bitbucket username as a repository variable"
                  fi
                  if [ -z "$TOKEN" ]; then
                    echo "⚠️  No authentication token available, skipping upload"
                  fi
                fi
            artifacts:
              - dist/*.tar.gz
              - dist/*.sha256
        - step:
            name: Build Static Library Distribution (Darwin AMD64)
            image: macos-12-xcode-14
            caches:
              - go
            script:
              - brew install make gcc pkg-config
              - git submodule update --init --recursive
              - export TAG_NAME=$BITBUCKET_TAG
              - export VERSION=${TAG_NAME#v}
              - export GOOS=darwin
              - export GOARCH=amd64
              - export CGO_ENABLED=1
              - 'echo "Building static library distribution for darwin-amd64 version: $VERSION"'
              - ./scripts/build-static-libs.sh
              - echo "=== Darwin AMD64 Distribution Package Created ==="
              - ls -lh dist/
              - cat dist/*.sha256
              - echo "===================================="
            after-script:
              - |
                TOKEN="${BITBUCKET_DOWNLOADS_TOKEN:-$BITBUCKET_API_TOKEN}"
                USERNAME="${BITBUCKET_USERNAME}"
                if [ ! -z "$TOKEN" ] && [ ! -z "$USERNAME" ]; then
                  echo "Uploading Darwin AMD64 distribution packages to Bitbucket Downloads..."
                  UPLOAD_SUCCESS=true
                  for file in dist/*.tar.gz dist/*.sha256; do
                    if [ -f "$file" ]; then
                      filename=$(basename "$file")
                      echo "Uploading $filename..."
                      RESPONSE=$(curl -s -X POST \
                        "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_OWNER/$BITBUCKET_REPO_SLUG/downloads" \
                        -u "$USERNAME:$TOKEN" \
                        -F "files=@$file" \
                        -w "\n%{http_code}")
                      HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
                      BODY=$(echo "$RESPONSE" | sed '$d')
                      if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
                        echo "✓ Uploaded $filename successfully (HTTP $HTTP_CODE)"
                      else
                        echo "✗ Failed to upload $filename (HTTP $HTTP_CODE)"
                        echo "Response: $BODY"
                        UPLOAD_SUCCESS=false
                      fi
                    fi
                  done
                  if [ "$UPLOAD_SUCCESS" = "false" ]; then
                    echo ""
                    echo "⚠️  UPLOAD FAILED - Authentication Issue"
                    echo ""
                    echo "Files are available as pipeline artifacts in the meantime."
                  fi
                else
                  echo "⚠️  Authentication not configured, skipping upload"
                  echo "Files are available as pipeline artifacts"
                fi
            artifacts:
              - dist/*.tar.gz
              - dist/*.sha256
        - step:
            name: Build Static Library Distribution (Darwin ARM64)
            image: macos-14-xcode-15
            caches:
              - go
            script:
              - brew install make gcc pkg-config
              - git submodule update --init --recursive
              - export TAG_NAME=$BITBUCKET_TAG
              - export VERSION=${TAG_NAME#v}
              - export GOOS=darwin
              - export GOARCH=arm64
              - export CGO_ENABLED=1
              - 'echo "Building static library distribution for darwin-arm64 version: $VERSION"'
              - ./scripts/build-static-libs.sh
              - echo "=== Darwin ARM64 Distribution Package Created ==="
              - ls -lh dist/
              - cat dist/*.sha256
              - echo "===================================="
            after-script:
              - |
                TOKEN="${BITBUCKET_DOWNLOADS_TOKEN:-$BITBUCKET_API_TOKEN}"
                USERNAME="${BITBUCKET_USERNAME}"
                if [ ! -z "$TOKEN" ] && [ ! -z "$USERNAME" ]; then
                  echo "Uploading Darwin ARM64 distribution packages to Bitbucket Downloads..."
                  UPLOAD_SUCCESS=true
                  for file in dist/*.tar.gz dist/*.sha256; do
                    if [ -f "$file" ]; then
                      filename=$(basename "$file")
                      echo "Uploading $filename..."
                      RESPONSE=$(curl -s -X POST \
                        "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_OWNER/$BITBUCKET_REPO_SLUG/downloads" \
                        -u "$USERNAME:$TOKEN" \
                        -F "files=@$file" \
                        -w "\n%{http_code}")
                      HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
                      BODY=$(echo "$RESPONSE" | sed '$d')
                      if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
                        echo "✓ Uploaded $filename successfully (HTTP $HTTP_CODE)"
                      else
                        echo "✗ Failed to upload $filename (HTTP $HTTP_CODE)"
                        echo "Response: $BODY"
                        UPLOAD_SUCCESS=false
                      fi
                    fi
                  done
                  if [ "$UPLOAD_SUCCESS" = "false" ]; then
                    echo ""
                    echo "⚠️  UPLOAD FAILED - Authentication Issue"
                    echo ""
                    echo "Files are available as pipeline artifacts in the meantime."
                  fi
                else
                  echo "⚠️  Authentication not configured, skipping upload"
                  echo "Files are available as pipeline artifacts"
                fi
            artifacts:
              - dist/*.tar.gz
              - dist/*.sha256

  pull-requests:
    '**':
      - parallel:
        - step: *lint
        - step:
            name: Run Tests for PR
            caches:
              - go
            script:
              - apt-get update
              - apt-get install -y build-essential pkg-config unzip curl wget
              - git submodule update --init --recursive || echo "Submodule init failed"
              - echo "Setting up MuPDF libraries..."
              - ./scripts/setup-mupdf.sh
              - export GO111MODULE=on
              - export CGO_ENABLED=1
              - export GOOS=linux
              - export GOARCH=amd64
              - export GOTOOLCHAIN=auto
              - go mod download
              - 'echo "Current directory: $(pwd)"'
              - echo "Verifying project structure..."
              - 'test -f go.mod || (echo "ERROR: go.mod not found" && exit 1)'
              - 'test -d pkg/mupdf || (echo "ERROR: pkg/mupdf directory not found" && exit 1)'
              - 'test -d third_party/mupdf || (echo "ERROR: third_party/mupdf directory not found" && exit 1)'
              - echo "Checking package files..."
              - ls -la pkg/mupdf/*.go | head -3 || echo "Package files not found"
              - echo "Checking MuPDF libraries..."
              - ls -la third_party/mupdf/build/release/*.a | head -3 || echo "MuPDF libraries not found"
              - echo "Verifying Go module path..."
              - go list -m || echo "Failed to list module"
              - echo "Checking package can be listed..."
              - go list ./pkg/mupdf || echo "Failed to list package"
              - echo "Running tests with race detection..."
              - go test -v -race ./pkg/mupdf/
              - echo "Generating coverage report for PR..."
              - go test -v -race -coverprofile=pr-coverage.out ./pkg/mupdf/
              - go tool cover -func=pr-coverage.out
              - echo "Uploading coverage to Codecov..."
              - |
                if [ -n "$CODECOV_TOKEN" ]; then
                  curl -s https://codecov.io/bash | bash -s - -f pr-coverage.out -t $CODECOV_TOKEN || echo "Codecov upload failed"
                else
                  echo "CODECOV_TOKEN not set, skipping Codecov upload"
                fi
            artifacts:
              - pr-coverage.out
