image: golang:1.21

definitions:
  caches:
    mupdf: third_party/mupdf/build/

  services:
    docker:
      memory: 2048

pipelines:
  default:
    - step:
        name: Build and Test
        caches:
          - go
          - mupdf
        script:
          # Install system dependencies
          - apt-get update
          - apt-get install -y build-essential make gcc g++ libc6-dev pkg-config
          - apt-get install -y libx11-dev libxext-dev libxrandr-dev libgl1-mesa-dev
          
          # Set up Go environment
          - export GO111MODULE=on
          - export CGO_ENABLED=1
          - export GOOS=linux
          - export GOARCH=amd64
          
          # Cache Go modules
          - go mod download
          
          # Build MuPDF library if not cached
          - |
            if [ ! -f "third_party/mupdf/build/release/libmupdf.a" ]; then
              echo "Building MuPDF library..."
              cd third_party/mupdf
              make -j$(nproc) libs
              cd ../..
            else
              echo "Using cached MuPDF library"
            fi
          
          # Verify MuPDF build
          - ls -la third_party/mupdf/build/release/ || echo "Build directory not found"
          
          # Run Go tests
          - go test -v ./...
          
          # Run specific package tests with coverage
          - go test -v -race -coverprofile=coverage.out ./pkg/mupdf/
          
          # Generate coverage report
          - go tool cover -html=coverage.out -o coverage.html
        artifacts:
          - coverage.html
          - coverage.out

  branches:
    main:
      - step:
          name: Build, Test and Deploy
          caches:
            - go
            - mupdf
          script:
            # Install system dependencies
            - apt-get update
            - apt-get install -y build-essential make gcc g++ libc6-dev pkg-config
            - apt-get install -y libx11-dev libxext-dev libxrandr-dev libgl1-mesa-dev
            
            # Set up Go environment
            - export GO111MODULE=on
            - export CGO_ENABLED=1
            - export GOOS=linux
            - export GOARCH=amd64
            
            # Cache Go modules
            - go mod download
            
            # Build MuPDF library
            - |
              if [ ! -f "third_party/mupdf/build/release/libmupdf.a" ]; then
                echo "Building MuPDF library..."
                cd third_party/mupdf
                make -j$(nproc) libs
                cd ../..
              else
                echo "Using cached MuPDF library"
              fi
            
            # Run comprehensive tests
            - go test -v -race -coverprofile=coverage.out ./...
            
            # Run benchmarks
            - go test -v -bench=. -benchmem ./pkg/mupdf/
            
            # Check code formatting
            - test -z "$(gofmt -l .)" || (echo "Code not formatted properly"; gofmt -l .; exit 1)
            
            # Run go vet
            - go vet ./...
            
            # Run staticcheck if available
            - |
              if command -v staticcheck >/dev/null 2>&1; then
                staticcheck ./...
              else
                echo "Staticcheck not available, skipping"
              fi
            
            # Generate coverage report
            - go tool cover -html=coverage.out -o coverage.html
            - go tool cover -func=coverage.out
            
            # Build examples or binaries if they exist
            - |
              if [ -d "cmd" ]; then
                echo "Building command line tools..."
                go build -v ./cmd/...
              fi
          artifacts:
            - coverage.html
            - coverage.out
          after-script:
            # Cleanup
            - rm -f coverage.out

  tags:
    v*:
      - step:
          name: Build, Test and Release
          caches:
            - go
            - mupdf
          script:
            # Install system dependencies and release tools
            - apt-get update
            - apt-get install -y build-essential make gcc g++ libc6-dev pkg-config
            - apt-get install -y libx11-dev libxext-dev libxrandr-dev libgl1-mesa-dev
            - apt-get install -y curl jq zip
            
            # Set up Go environment
            - export GO111MODULE=on
            - export CGO_ENABLED=1
            - export TAG_NAME=$BITBUCKET_TAG
            - echo "Building release for tag: $TAG_NAME"
            
            # Cache Go modules
            - go mod download
            
            # Build MuPDF library
            - |
              if [ ! -f "third_party/mupdf/build/release/libmupdf.a" ]; then
                echo "Building MuPDF library..."
                cd third_party/mupdf
                make -j$(nproc) libs
                cd ../..
              fi
            
            # Run comprehensive test suite for release
            - echo "Running comprehensive test suite..."
            - go test -v -race -coverprofile=release-coverage.out ./...
            - go tool cover -func=release-coverage.out
            - go vet ./...
            
            # Validate code formatting
            - test -z "$(gofmt -l .)" || (echo "Code not formatted properly"; exit 1)
            
            # Create release directory structure
            - mkdir -p releases/{source,binaries,documentation}
            
            # Build command line tools
            - echo "Building command line tools..."
            - CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=$TAG_NAME" -o releases/binaries/go-mupdf-linux-amd64 ./cmd/go-mupdf/ || echo "go-mupdf tool not built"
            - CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=$TAG_NAME" -o releases/binaries/create-test-pdf-linux-amd64 ./cmd/create-test-pdf/ || echo "create-test-pdf tool not built"
            
            # Create source archive
            - echo "Creating source archive..."
            - git archive --format=tar.gz --prefix=go-mupdf-$TAG_NAME/ $TAG_NAME > releases/source/go-mupdf-$TAG_NAME-source.tar.gz
            
            # Generate release documentation package
            - echo "Packaging documentation..."
            - tar -czf releases/documentation/go-mupdf-$TAG_NAME-docs.tar.gz docs/ examples/ README.md LICENSE CHANGELOG.md
            
            # Create binary archives
            - |
              cd releases/binaries
              if [ -f "go-mupdf-linux-amd64" ]; then
                tar -czf go-mupdf-$TAG_NAME-linux-amd64.tar.gz go-mupdf-linux-amd64
                echo "Created go-mupdf binary archive"
              fi
              if [ -f "create-test-pdf-linux-amd64" ]; then
                tar -czf create-test-pdf-$TAG_NAME-linux-amd64.tar.gz create-test-pdf-linux-amd64
                echo "Created create-test-pdf binary archive"
              fi
              cd ../..
            
            # Generate release notes from changelog
            - echo "Generating release notes..."
            - |
              cat > releases/RELEASE_NOTES.md << EOF
              # Go MuPDF $TAG_NAME Release
              
              **Release Date**: $(date +"%Y-%m-%d")
              **Git Tag**: $TAG_NAME
              **Commit**: $BITBUCKET_COMMIT
              
              ## Installation
              
              ### Go Module
              \`\`\`bash
              go get bitbucket.org/lexmata/go-mupdf@$TAG_NAME
              \`\`\`
              
              ### Binary Downloads
              - [Linux AMD64 Tools](releases/binaries/)
              - [Source Code](releases/source/)
              - [Documentation](releases/documentation/)
              
              ## What's Included
              
              - **Source Code**: Complete Go MuPDF wrapper with MuPDF library
              - **Documentation**: Comprehensive guides and API reference
              - **Examples**: Working code examples and tutorials
              - **Command Line Tools**: go-mupdf and create-test-pdf utilities
              - **Tests**: Full test suite with 81.8% coverage
              
              ## System Requirements
              
              - Go 1.21 or later
              - C compiler (GCC/Clang/MSVC)
              - Make build system
              - System dependencies (see installation guide)
              
              ## Changelog
              
              $(grep -A 50 "## \[$TAG_NAME\]" CHANGELOG.md | head -50)
              
              ## Verification
              
              ### Checksums
              \`\`\`
              $(find releases -type f -name "*.tar.gz" -exec sha256sum {} \;)
              \`\`\`
              
              ### Test Coverage
              \`\`\`
              $(go tool cover -func=release-coverage.out | tail -1)
              \`\`\`
              
              ---
              
              For support, documentation, and examples, visit the [repository](https://bitbucket.org/lexmata/go-mupdf).
              EOF
            
            # Create checksums
            - echo "Generating checksums..."
            - cd releases && find . -type f -name "*.tar.gz" -exec sha256sum {} \; > SHA256SUMS && cd ..
            
            # Log release summary
            - echo "=== Release Summary ==="
            - echo "Tag: $TAG_NAME"
            - echo "Files created:"
            - find releases -type f -ls
            - echo "===================="
            
          after-script:
            # Upload to Bitbucket Downloads (if configured)
            - |
              if [ ! -z "$BITBUCKET_DOWNLOADS_TOKEN" ]; then
                echo "Uploading release artifacts to Bitbucket Downloads..."
                for file in releases/binaries/*.tar.gz releases/source/*.tar.gz releases/documentation/*.tar.gz; do
                  if [ -f "$file" ]; then
                    filename=$(basename "$file")
                    curl -X POST \
                      "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_OWNER/$BITBUCKET_REPO_SLUG/downloads" \
                      -H "Authorization: Bearer $BITBUCKET_DOWNLOADS_TOKEN" \
                      -F "files=@$file" \
                      || echo "Failed to upload $filename"
                  fi
                done
              else
                echo "BITBUCKET_DOWNLOADS_TOKEN not set, skipping upload"
              fi
              
          artifacts:
            - releases/**
            - release-coverage.out

  pull-requests:
    '**':
      - step:
          name: PR Build and Test
          caches:
            - go
            - mupdf
          script:
            # Install system dependencies
            - apt-get update
            - apt-get install -y build-essential make gcc g++ libc6-dev pkg-config
            - apt-get install -y libx11-dev libxext-dev libxrandr-dev libgl1-mesa-dev
            
            # Set up Go environment
            - export GO111MODULE=on
            - export CGO_ENABLED=1
            
            # Cache Go modules
            - go mod download
            
            # Build MuPDF library
            - |
              if [ ! -f "third_party/mupdf/build/release/libmupdf.a" ]; then
                echo "Building MuPDF library..."
                cd third_party/mupdf
                make -j$(nproc) libs
                cd ../..
              fi
            
            # Run tests with race detection
            - go test -v -race ./...
            
            # Check code formatting
            - test -z "$(gofmt -l .)" || (echo "Code not formatted properly"; gofmt -l .; exit 1)
            
            # Run go vet
            - go vet ./...
            
            # Generate coverage for changed files
            - go test -v -race -coverprofile=pr-coverage.out ./pkg/mupdf/
          artifacts:
            - pr-coverage.out