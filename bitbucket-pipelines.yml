image: golang:1.23.4

definitions:
  caches:
    go: /go/pkg/mod
    gotools: /go/bin
    mupdf-libs:
      # NOTE: mupdf.lock pins the MuPDF submodule commit. It MUST be regenerated
      # whenever the submodule is bumped (.gitmodules alone does not change when
      # the submodule pointer moves):
      #   ./scripts/check-mupdf-lock.sh --fix
      # The pre-commit hook and the build-mupdf step both verify the pin via
      # scripts/check-mupdf-lock.sh, so a stale pin fails rather than silently
      # serving cached libraries from the wrong MuPDF commit.
      key:
        files:
          - .gitmodules
          - mupdf.lock
      path: mupdf-artifacts

  services:
    docker:
      memory: 2048

  steps:
    - step: &build-mupdf
        name: Build MuPDF Libraries
        caches:
          - mupdf-libs
        script:
          - apt-get update
          - apt-get install -y build-essential pkg-config unzip
          # Fail loudly if the cache key pin is stale: a wrong pin means this
          # step's cached output is reused for a different MuPDF commit.
          - ./scripts/check-mupdf-lock.sh
          - git submodule update --init --recursive
          - echo "Building MuPDF libraries artifact..."
          - ./scripts/build-mupdf-artifact.sh
          - echo "MuPDF artifact created successfully"
        artifacts:
          - mupdf-artifacts/**
    - step: &lint
        name: Lint Code
        caches:
          - go
          - gotools
          - mupdf-libs
        script:
          - apt-get update
          - apt-get install -y build-essential pkg-config unzip curl wget
          - git submodule update --init --recursive || { echo "Submodule init failed"; exit 1; }
          - echo "Installing pre-built MuPDF libraries..."
          - ./scripts/install-prebuilt-libs.sh
          - 'echo "Current directory: $(pwd)"'
          - |
            if [ ! -f "go.mod" ]; then
              echo "ERROR: go.mod not found in current directory"
              echo "Current directory contents:"
              ls -la
              exit 1
            fi
          - 'echo "Project root verified: $(pwd)"'
          - export PATH=$PATH:$(go env GOPATH)/bin
          - export GOTOOLCHAIN=auto
          - export GOFLAGS=-buildvcs=false
          - |
            if command -v golangci-lint >/dev/null 2>&1; then
              echo "golangci-lint already installed (cached)"
            else
              echo "Installing golangci-lint v1.64.8..."
              go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
            fi
          - echo "Checking code formatting with gofmt..."
          - |
            UNFORMATTED=$(gofmt -l .)
            if [ -n "$UNFORMATTED" ]; then
              echo "⚠️ The following files are not properly formatted (non-blocking):"
              echo "$UNFORMATTED"
            else
              echo "✅ All files are properly formatted"
            fi
          - echo "Running go vet..."
          - echo "Checking for cmd directory..."
          - ls -la cmd 2>/dev/null || echo "cmd directory not found"
          - |
            if [ -d "cmd" ] && [ -n "$(find cmd -name '*.go' -type f 2>/dev/null | head -1)" ]; then
              echo "cmd directory found with Go files, running go vet on pkg and cmd"
              go vet ./pkg/... ./cmd/... || echo "go vet found issues (non-blocking)"
            else
              echo "cmd directory not found or empty, running go vet on pkg only"
              go vet ./pkg/... || echo "go vet found issues (non-blocking)"
            fi
          - echo "Running golangci-lint..."
          - |
            if [ -d "cmd" ] && [ -n "$(find cmd -name '*.go' -type f 2>/dev/null | head -1)" ]; then
              echo "cmd directory found with Go files, running golangci-lint on pkg and cmd"
              golangci-lint run ./pkg/... ./cmd/... || echo "golangci-lint found issues (non-blocking)"
            else
              echo "cmd directory not found or empty, running golangci-lint on pkg only"
              golangci-lint run ./pkg/... || echo "golangci-lint found issues (non-blocking)"
            fi
          - |
            if command -v staticcheck >/dev/null 2>&1; then
              echo "Running staticcheck..."
              if [ -d "cmd" ] && [ -n "$(find cmd -name '*.go' -type f 2>/dev/null | head -1)" ]; then
                echo "cmd directory found with Go files, running staticcheck on pkg and cmd"
                staticcheck ./pkg/... ./cmd/... || echo "staticcheck found issues (non-blocking)"
              else
                echo "cmd directory not found or empty, running staticcheck on pkg only"
                staticcheck ./pkg/... || echo "staticcheck found issues (non-blocking)"
              fi
            else
              echo "Installing staticcheck 2025.1..."
              go install honnef.co/go/tools/cmd/staticcheck@2025.1
              if [ -d "cmd" ] && [ -n "$(find cmd -name '*.go' -type f 2>/dev/null | head -1)" ]; then
                echo "cmd directory found with Go files, running staticcheck on pkg and cmd"
                staticcheck ./pkg/... ./cmd/... || echo "staticcheck found issues (non-blocking)"
              else
                echo "cmd directory not found or empty, running staticcheck on pkg only"
                staticcheck ./pkg/... || echo "staticcheck found issues (non-blocking)"
              fi
            fi
    - step: &test
        name: Run Tests
        caches:
          - go
          - mupdf-libs
        script:
          - apt-get update
          - apt-get install -y build-essential pkg-config unzip curl wget
          - 'echo "Initial working directory: $(pwd)"'
          - |
            if [ ! -f "go.mod" ]; then
              echo "ERROR: go.mod not found in current directory"
              echo "Current directory contents:"
              ls -la
              exit 1
            fi
          - 'echo "Project root verified: $(pwd)"'
          - git submodule update --init --recursive || { echo "Submodule init failed"; exit 1; }
          - echo "Installing pre-built MuPDF libraries..."
          - ./scripts/install-prebuilt-libs.sh
          - export GO111MODULE=on
          - export CGO_ENABLED=1
          - export GOOS=linux
          - export GOARCH=amd64
          - export GOTOOLCHAIN=auto
          - cd $(git rev-parse --show-toplevel 2>/dev/null || pwd)
          - 'echo "Final working directory: $(pwd)"'
          - go mod download
          - 'echo "Current directory: $(pwd)"'
          - echo "Verifying project structure..."
          - 'test -f go.mod || (echo "ERROR: go.mod not found" && exit 1)'
          - 'test -d pkg/mupdf || (echo "ERROR: pkg/mupdf directory not found" && exit 1)'
          - 'test -d third_party/mupdf || (echo "ERROR: third_party/mupdf directory not found" && exit 1)'
          - echo "Checking package files..."
          - ls -la pkg/mupdf/*.go | head -3 || echo "Package files not found"
          - echo "Checking MuPDF libraries..."
          - ls -la third_party/mupdf/build/release/*.a | head -3 || echo "MuPDF libraries not found"
          - echo "Verifying Go module path..."
          - go list -m || echo "Failed to list module"
          - echo "Checking package can be listed..."
          - go list ./pkg/mupdf || echo "Failed to list package"
          - echo "Running all tests with race detection..."
          - go test -v -race ./pkg/mupdf/ || echo "Tests had failures (non-blocking)"
          - echo "Running package tests with coverage..."
          - go test -v -race -coverprofile=coverage.out ./pkg/mupdf/ || echo "Coverage tests had failures (non-blocking)"
          - echo "Generating coverage report..."
          - go tool cover -html=coverage.out -o coverage.html
          - go tool cover -func=coverage.out
          - echo "Uploading coverage to Codecov..."
          - ./scripts/upload-coverage.sh coverage.out
        artifacts:
          - coverage.html
          - coverage.out

pipelines:
  default:
    # Build MuPDF once, then share the artifact with the parallel steps
    - step: *build-mupdf
    - parallel:
      - step: *lint
      - step: *test

  branches:
    main:
      # Build MuPDF once, then share the artifact with the parallel steps
      - step: *build-mupdf
      - parallel:
        - step: *lint
        - step:
            name: Run Tests and Benchmarks
            caches:
              - go
              - mupdf-libs
            script:
            - apt-get update
            - apt-get install -y build-essential pkg-config unzip curl wget
            - git submodule update --init --recursive || { echo "Submodule init failed"; exit 1; }
            - echo "Installing pre-built MuPDF libraries..."
            - ./scripts/install-prebuilt-libs.sh
            - export GO111MODULE=on
            - export CGO_ENABLED=1
            - export GOOS=linux
            - export GOARCH=amd64
            - export GOTOOLCHAIN=auto
            - go mod download
            - 'echo "Current directory: $(pwd)"'
            - echo "Verifying project structure..."
            - 'test -f go.mod || (echo "ERROR: go.mod not found" && exit 1)'
            - 'test -d pkg/mupdf || (echo "ERROR: pkg/mupdf directory not found" && exit 1)'
            - 'test -d third_party/mupdf || (echo "ERROR: third_party/mupdf directory not found" && exit 1)'
            - echo "Checking package files..."
            - ls -la pkg/mupdf/*.go | head -3 || echo "Package files not found"
            - echo "Checking MuPDF libraries..."
            - ls -la third_party/mupdf/build/release/*.a | head -3 || echo "MuPDF libraries not found"
            - echo "Verifying Go module path..."
            - go list -m || echo "Failed to list module"
            - echo "Checking package can be listed..."
            - go list ./pkg/mupdf || echo "Failed to list package"
            - echo "Running comprehensive tests with race detection..."
            - go test -v -race -coverprofile=coverage.out ./pkg/mupdf/
            - echo "Running benchmarks..."
            - go test -v -bench=. -benchmem ./pkg/mupdf/
            - echo "Generating coverage report..."
            - go tool cover -html=coverage.out -o coverage.html
            - go tool cover -func=coverage.out
            - echo "Uploading coverage to Codecov..."
            - ./scripts/upload-coverage.sh coverage.out
            - |
              if [ -d "cmd" ] && [ -n "$(find cmd -name '*.go' -type f 2>/dev/null | head -1)" ]; then
                echo "Building command line tools..."
                go build -v ./cmd/...
              else
                echo "cmd directory not found or contains no Go files, skipping build"
              fi
          artifacts:
            - coverage.html
            - coverage.out

  tags:
    v*:
      - step: *build-mupdf
      - parallel:
        - step: *lint
        - step:
            name: Run Tests for Release
            caches:
              - go
              - mupdf-libs
            script:
            - apt-get update
            - apt-get install -y build-essential pkg-config unzip
            - git submodule update --init --recursive || { echo "Submodule init failed"; exit 1; }
            - echo "Installing pre-built MuPDF libraries..."
            - ./scripts/install-prebuilt-libs.sh
            - export GO111MODULE=on
            - export CGO_ENABLED=1
            - export TAG_NAME=$BITBUCKET_TAG
            - export GOTOOLCHAIN=auto
            - 'echo "Building release for tag: $TAG_NAME"'
            - go mod download
            - 'echo "Current directory: $(pwd)"'
            - echo "Verifying project structure..."
            - 'test -f go.mod || (echo "ERROR: go.mod not found" && exit 1)'
            - 'test -d pkg/mupdf || (echo "ERROR: pkg/mupdf directory not found" && exit 1)'
            - 'test -d third_party/mupdf || (echo "ERROR: third_party/mupdf directory not found" && exit 1)'
            - echo "Checking package files..."
            - ls -la pkg/mupdf/*.go | head -3 || echo "Package files not found"
            - echo "Checking MuPDF libraries..."
            - ls -la third_party/mupdf/build/release/*.a | head -3 || echo "MuPDF libraries not found"
            - echo "Verifying Go module path..."
            - go list -m || echo "Failed to list module"
            - echo "Checking package can be listed..."
            - go list ./pkg/mupdf || echo "Failed to list package"
            - echo "Running comprehensive test suite..."
            - go test -v -race -coverprofile=release-coverage.out ./pkg/mupdf/
            - go tool cover -func=release-coverage.out
            - echo "Uploading coverage to Codecov..."
            - ./scripts/upload-coverage.sh release-coverage.out
          artifacts:
            - release-coverage.out
      - parallel:
        - step:
            name: Build Static Library Distribution (AMD64)
            caches:
              - go
              - mupdf-libs
            script:
              - apt-get update
              - apt-get install -y build-essential pkg-config unzip
              - git submodule update --init --recursive
              - export TAG_NAME=$BITBUCKET_TAG
              - export VERSION=${TAG_NAME#v}
              - export GOARCH=amd64
              # Reuse the libraries built by the build-mupdf step instead of rebuilding.
              # install-prebuilt-libs.sh places libs/headers under third_party/mupdf/,
              # which is exactly where build-static-libs.sh --skip-build packages from.
              - echo "Installing pre-built MuPDF libraries from build artifact..."
              - ./scripts/install-prebuilt-libs.sh
              - 'echo "Building static library distribution for linux-amd64 version: $VERSION"'
              - ./scripts/build-static-libs.sh --skip-build
              - echo "=== AMD64 Distribution Package Created ==="
              - ls -lh dist/
              - cat dist/*.sha256
              - echo "===================================="
            after-script:
              - |
                TOKEN="${BITBUCKET_DOWNLOADS_TOKEN:-$BITBUCKET_API_TOKEN}"
                USERNAME="${BITBUCKET_USERNAME}"
                if [ ! -z "$TOKEN" ] && [ ! -z "$USERNAME" ]; then
                  echo "Uploading distribution packages to Bitbucket Downloads..."
                  UPLOAD_SUCCESS=true
                  for file in dist/*.tar.gz dist/*.sha256; do
                    if [ -f "$file" ]; then
                      filename=$(basename "$file")
                      echo "Uploading $filename..."
                      RESPONSE=$(curl -s -X POST \
                        "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_OWNER/$BITBUCKET_REPO_SLUG/downloads" \
                        -u "$USERNAME:$TOKEN" \
                        -F "files=@$file" \
                        -w "\n%{http_code}")
                      HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
                      BODY=$(echo "$RESPONSE" | sed '$d')
                      if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
                        echo "✓ Uploaded $filename successfully (HTTP $HTTP_CODE)"
                      else
                        echo "✗ Failed to upload $filename (HTTP $HTTP_CODE)"
                        echo "Response: $BODY"
                        UPLOAD_SUCCESS=false
                      fi
                    fi
                  done
                  if [ "$UPLOAD_SUCCESS" = "false" ]; then
                    echo ""
                    echo "⚠️  UPLOAD FAILED - Authentication Issue"
                    echo ""
                    echo "Required Repository Variables:"
                    echo "1. BITBUCKET_USERNAME - Your Bitbucket account username/email"
                    echo "2. BITBUCKET_DOWNLOADS_TOKEN - App password with 'Repositories: Write'"
                    echo ""
                    echo "Setup Instructions:"
                    echo "1. Go to: https://bitbucket.org/account/settings/app-passwords/"
                    echo "2. Create app password with 'Repositories: Write' permission"
                    echo "3. Add both variables at: Repository Settings > Pipelines > Repository variables"
                    echo ""
                    echo "Files are available as pipeline artifacts in the meantime."
                  fi
                else
                  if [ -z "$USERNAME" ]; then
                    echo "⚠️  BITBUCKET_USERNAME not set, skipping upload"
                    echo "Set your Bitbucket username as a repository variable"
                  fi
                  if [ -z "$TOKEN" ]; then
                    echo "⚠️  No authentication token available, skipping upload"
                  fi
                fi
            artifacts:
              - dist/*.tar.gz
              - dist/*.sha256
        - step:
            name: Build Static Library Distribution (ARM64)
            caches:
              - go
            script:
              - apt-get update
              - apt-get install -y build-essential pkg-config unzip gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user-static
              - git submodule update --init --recursive
              - export TAG_NAME=$BITBUCKET_TAG
              - export VERSION=${TAG_NAME#v}
              - export GOOS=linux
              - export GOARCH=arm64
              - export CC=aarch64-linux-gnu-gcc
              - export CXX=aarch64-linux-gnu-g++
              - export CGO_ENABLED=1
              - 'echo "Building static library distribution for linux-arm64 version: $VERSION"'
              - 'echo "Cross-compiling MuPDF for ARM64..."'
              - ./scripts/build-static-libs.sh
              - echo "=== ARM64 Distribution Package Created ==="
              - ls -lh dist/
              - cat dist/*.sha256
              - echo "===================================="
            after-script:
              - |
                TOKEN="${BITBUCKET_DOWNLOADS_TOKEN:-$BITBUCKET_API_TOKEN}"
                USERNAME="${BITBUCKET_USERNAME}"
                if [ ! -z "$TOKEN" ] && [ ! -z "$USERNAME" ]; then
                  echo "Uploading ARM64 distribution packages to Bitbucket Downloads..."
                  UPLOAD_SUCCESS=true
                  for file in dist/*.tar.gz dist/*.sha256; do
                    if [ -f "$file" ]; then
                      filename=$(basename "$file")
                      echo "Uploading $filename..."
                      RESPONSE=$(curl -s -X POST \
                        "https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_OWNER/$BITBUCKET_REPO_SLUG/downloads" \
                        -u "$USERNAME:$TOKEN" \
                        -F "files=@$file" \
                        -w "\n%{http_code}")
                      HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
                      BODY=$(echo "$RESPONSE" | sed '$d')
                      if [ "$HTTP_CODE" = "201" ] || [ "$HTTP_CODE" = "200" ]; then
                        echo "✓ Uploaded $filename successfully (HTTP $HTTP_CODE)"
                      else
                        echo "✗ Failed to upload $filename (HTTP $HTTP_CODE)"
                        echo "Response: $BODY"
                        UPLOAD_SUCCESS=false
                      fi
                    fi
                  done
                  if [ "$UPLOAD_SUCCESS" = "false" ]; then
                    echo ""
                    echo "⚠️  UPLOAD FAILED - Authentication Issue"
                    echo ""
                    echo "Required Repository Variables:"
                    echo "1. BITBUCKET_USERNAME - Your Bitbucket account username/email"
                    echo "2. BITBUCKET_DOWNLOADS_TOKEN - App password with 'Repositories: Write'"
                    echo ""
                    echo "Setup Instructions:"
                    echo "1. Go to: https://bitbucket.org/account/settings/app-passwords/"
                    echo "2. Create app password with 'Repositories: Write' permission"
                    echo "3. Add both variables at: Repository Settings > Pipelines > Repository variables"
                    echo ""
                    echo "Files are available as pipeline artifacts in the meantime."
                  fi
                else
                  if [ -z "$USERNAME" ]; then
                    echo "⚠️  BITBUCKET_USERNAME not set, skipping upload"
                    echo "Set your Bitbucket username as a repository variable"
                  fi
                  if [ -z "$TOKEN" ]; then
                    echo "⚠️  No authentication token available, skipping upload"
                  fi
                fi
            artifacts:
              - dist/*.tar.gz
              - dist/*.sha256

  pull-requests:
    '**':
      # Build MuPDF once, then share the artifact with the parallel steps
      - step: *build-mupdf
      - parallel:
        - step: *lint
        - step:
            name: Run Tests for PR
            caches:
              - go
              - mupdf-libs
            script:
              - apt-get update
              - apt-get install -y build-essential pkg-config unzip curl wget
              - git submodule update --init --recursive || { echo "Submodule init failed"; exit 1; }
              - echo "Installing pre-built MuPDF libraries..."
              - ./scripts/install-prebuilt-libs.sh
              - export GO111MODULE=on
              - export CGO_ENABLED=1
              - export GOOS=linux
              - export GOARCH=amd64
              - export GOTOOLCHAIN=auto
              - go mod download
              - 'echo "Current directory: $(pwd)"'
              - echo "Verifying project structure..."
              - 'test -f go.mod || (echo "ERROR: go.mod not found" && exit 1)'
              - 'test -d pkg/mupdf || (echo "ERROR: pkg/mupdf directory not found" && exit 1)'
              - 'test -d third_party/mupdf || (echo "ERROR: third_party/mupdf directory not found" && exit 1)'
              - echo "Checking package files..."
              - ls -la pkg/mupdf/*.go | head -3 || echo "Package files not found"
              - echo "Checking MuPDF libraries..."
              - ls -la third_party/mupdf/build/release/*.a | head -3 || echo "MuPDF libraries not found"
              - echo "Verifying Go module path..."
              - go list -m || echo "Failed to list module"
              - echo "Checking package can be listed..."
              - go list ./pkg/mupdf || echo "Failed to list package"
              - echo "Running tests with race detection..."
              - go test -v -race ./pkg/mupdf/
              - echo "Generating coverage report for PR..."
              - go test -v -race -coverprofile=pr-coverage.out ./pkg/mupdf/
              - go tool cover -func=pr-coverage.out
              - echo "Uploading coverage to Codecov..."
              - ./scripts/upload-coverage.sh pr-coverage.out
            artifacts:
              - pr-coverage.out
