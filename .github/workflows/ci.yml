name: CI

# Lint + test on every push and PR. Replaces the old Bitbucket pipeline, whose
# lint/vet/test steps all ended in `|| echo "(non-blocking)"` and so never
# actually failed a build. Here every check is blocking. Runs native amd64
# only — the cgo package needs the MuPDF static libs, which we build from the
# submodule; arch-specific artifact builds live in release.yml.

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & test (linux-amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # CI builds with the current toolchain, not the minimum in go.mod.
      # go.mod's `go` line is the oldest Go a consumer may build with
      # (lexmata-identification is on 1.26), so it stays where it is; raising
      # it would force every consumer to upgrade. Keep this in step with
      # GO_VERSION in Dockerfile and the image in Dockerfile.test.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: true

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config unzip binutils

      # The tools the test suite compares the MuPDF operations against
      # (pdftoppm, qpdf, cpdf). GOMUPDF_REQUIRE_TOOLS makes a missing one fail
      # those tests instead of skipping them, so the comparisons cannot
      # silently stop running. cpdf is not packaged for Ubuntu; the script
      # fetches a pinned, checksummed binary.
      - name: Install comparison tools
        run: |
          sudo apt-get install -y poppler-utils qpdf
          sudo ./scripts/install-cpdf.sh
          echo "GOMUPDF_REQUIRE_TOOLS=1" >> "$GITHUB_ENV"

      # Build the MuPDF static libs into third_party/mupdf/build/release so the
      # cgo package links. --build-only skips distribution packaging.
      - name: Build MuPDF static libraries
        run: ./scripts/build-static-libs.sh --build-only

      - name: gofmt
        run: |
          # Our Go only — third_party/mupdf is a C submodule.
          unformatted=$(git ls-files '*.go' | grep -v '^third_party/' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./pkg/...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./pkg/...

      # Pinned to a release built for the Go version above: a linter older
      # than the toolchain cannot read its export data and exits without
      # checking anything. golangci-lint v2 needs action v7 or later. Bump
      # deliberately; a floating "latest" turns a new linter release into a
      # surprise red build.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          args: ./pkg/...
