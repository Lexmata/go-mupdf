name: Release static libraries

# Builds go-mupdf's MuPDF static-library archives and publishes them as GitHub
# Release assets. Each platform is built NATIVELY on a matching-arch GitHub
# runner (ubuntu-24.04 for amd64, ubuntu-24.04-arm for arm64) — never
# cross-compiled, no QEMU. MuPDF wraps its font/resource blobs (*.otf.o,
# *.cff.o, *.zip.o) with the host ld/objcopy; a cross-compile
# (CC=aarch64-linux-gnu-gcc on an x86-64 host) compiles the C as aarch64 but
# wraps the blobs as x86-64, producing a mixed-arch archive that links on the
# build host yet fails on the target with "incompatible with aarch64 output".
# That is exactly how the Bitbucket-built v1.9.2 linux-arm64 artifact shipped
# broken. A native runner keeps gcc, ld and objcopy all one arch, so the whole
# archive is single-arch; scripts/build-static-libs.sh then verifies every
# object member and fails the build if any is foreign-arch. Native arm runners
# also replaced QEMU emulation, which took ~30-60 min per arm64 build.
#
# Both legs pin ubuntu-24.04 (glibc 2.39) to match the consumer's ubuntu:24.04
# runtime: the static .a files reference glibc symbols resolved at the
# consumer's final link, so building against a newer glibc floor than the
# runtime image would break at deploy.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading v, e.g. 1.9.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-amd64
            runs_on: ubuntu-24.04
          - platform: linux-arm64
            runs_on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # Reject anything that isn't a plain semver — this value is passed to
          # the build script via env, so an unvalidated dispatch input would be
          # a command-injection vector.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version '$version'; expected N.N.N" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config unzip binutils

      - name: Build static libraries (native ${{ matrix.platform }})
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-static-libs.sh

      - name: Show package
        run: ls -lh dist/ && cat dist/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid version '$INPUT_VERSION'; expected N.N.N" >&2
              exit 1
            fi
            echo "tag=v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # Create the release; on re-run (workflow_dispatch for an existing
          # version) fall through to uploading assets. Only "already exists" is
          # a recoverable create failure — anything else (denied contents:write,
          # rate limit, bad tag) must fail loudly rather than be masked behind a
          # subsequent upload error.
          if gh release create "$TAG" --repo "$REPO" --title "$TAG" \
                --generate-notes dist/*.tar.gz dist/*.sha256 2> create.err; then
            cat create.err >&2 || true
          elif grep -qi "already exists" create.err; then
            echo "Release $TAG exists; uploading assets."
            gh release upload "$TAG" --repo "$REPO" --clobber dist/*.tar.gz dist/*.sha256
          else
            echo "Release creation failed for a reason other than a duplicate tag:" >&2
            cat create.err >&2
            exit 1
          fi
