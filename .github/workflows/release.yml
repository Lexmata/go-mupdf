name: Release static libraries

# Builds go-mupdf's MuPDF static-library archives and publishes them as GitHub
# Release assets. Each platform is built NATIVELY inside a container of its own
# architecture — never cross-compiled. MuPDF wraps its font/resource blobs
# (*.otf.o, *.cff.o, *.zip.o) with the host ld/objcopy; a cross-compile
# (CC=aarch64-linux-gnu-gcc on an x86-64 host) compiles the C as aarch64 but
# wraps the blobs as x86-64, producing a mixed-arch archive that links on the
# build host yet fails on the target with "incompatible with aarch64 output".
# That is exactly how the Bitbucket-built v1.9.2 linux-arm64 artifact shipped
# broken. Building in a matching-arch container (arm64 via QEMU) keeps gcc, ld
# and objcopy all the target arch, so the whole archive is one architecture.
# scripts/build-static-libs.sh then verifies every object member and fails the
# build if any is foreign-arch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading v, e.g. 1.9.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-amd64
            docker_platform: linux/amd64
          - platform: linux-arm64
            docker_platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU for cross-arch containers
        uses: docker/setup-qemu-action@v3

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          # Reject anything that isn't a plain semver — this value is passed to a
          # shell inside the build container, so an unvalidated dispatch input
          # would be a command-injection vector.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version '$version'; expected N.N.N" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build static libraries (native ${{ matrix.platform }})
        run: |
          docker run --rm --platform=${{ matrix.docker_platform }} \
            -v "$PWD:/src" -w /src \
            -e VERSION="${{ steps.version.outputs.version }}" \
            public.ecr.aws/docker/library/ubuntu:24.04 \
            bash -c '
              set -e
              apt-get update
              apt-get install -y build-essential pkg-config unzip binutils
              ./scripts/build-static-libs.sh
            '

      - name: Show package
        run: ls -lh dist/ && cat dist/*.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid version '$INPUT_VERSION'; expected N.N.N" >&2
              exit 1
            fi
            echo "tag=v$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            dist/*.tar.gz dist/*.sha256 \
          || gh release upload "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" --clobber \
            dist/*.tar.gz dist/*.sha256
